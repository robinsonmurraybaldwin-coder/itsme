<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>연습뱅크</title>
  <script>try{document.documentElement.dataset.theme=localStorage.getItem("theme")||""}catch(e){}</script>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/home.js"></script>
</head>
<body>
  <div class="app">
    <header class="header">
      <h1 class="header__logo">연습뱅크</h1>
      <button class="icon-btn" data-icon="bell" aria-label="알림"></button>
      <button class="icon-btn" id="theme" aria-label="테마 전환"></button>
      <button class="icon-btn" data-icon="menu" aria-label="전체 메뉴"></button>
    </header>

    <main class="page">
      <div class="home-grid">
        <div>
          <a class="banner" href="exchange.html">
            <div class="banner__text">
              <strong>오늘의 환율 확인하기</strong>
              <span>실시간 환율·코인 시세를 볼 수 있어요</span>
            </div>
            <div class="banner__emoji" aria-hidden="true">💱</div>
          </a>

          <div class="seg" role="tablist">
            <button class="seg__btn is-active" role="tab" aria-selected="true" data-tab="mine">내 계좌</button>
            <button class="seg__btn" role="tab" aria-selected="false" data-tab="other">다른금융</button>
          </div>

          <section aria-label="내 계좌">
            <div class="carousel" id="accounts">
              <div class="skeleton skeleton--card"></div>
            </div>
            <div class="dots" id="dots"></div>
          </section>

          <div class="quick">
            <a href="history.html">최근 이체내역 <span data-icon="right"></span></a>
            <a href="transfer.html">바로 송금 <span data-icon="right"></span></a>
          </div>
        </div>

        <div>
          <section class="section">
            <h2 class="section__title">나만의 맞춤메뉴</h2>
            <div class="menu-grid">
              <a href="history.html"><span class="menu-grid__icon">📒</span>거래내역</a>
              <a href="transfer.html"><span class="menu-grid__icon">💸</span>이체</a>
              <a href="exchange.html"><span class="menu-grid__icon">💱</span>환율</a>
              <a href="exchange.html#coin"><span class="menu-grid__icon">🪙</span>코인시세</a>
              <a href="#" data-soon><span class="menu-grid__icon">🎁</span>포인트</a>
              <a href="#" data-soon><span class="menu-grid__icon">➕</span>추가</a>
            </div>
          </section>

          <section class="section">
            <h2 class="section__title">지금 환율</h2>
            <div class="ticker-list" id="rates">
              <div class="skeleton skeleton--row"></div>
              <div class="skeleton skeleton--row"></div>
            </div>
          </section>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
