<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>시세 - 연습뱅크</title>
  <script>try{document.documentElement.dataset.theme=localStorage.getItem("theme")||""}catch(e){}</script>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/exchange.js"></script>
</head>
<body>
  <div class="app">
    <header class="header">
      <h1 class="header__title">시세</h1>
      <button class="icon-btn" id="theme" aria-label="테마 전환"></button>
    </header>

    <main class="page">
      <div class="home-grid">
        <div>
          <section class="card" aria-labelledby="calc-title">
            <h2 class="section__title" id="calc-title">환율 계산기</h2>
            <div class="calc">
              <div class="calc__row">
                <select class="select" id="currency" aria-label="통화"></select>
                <input class="input-line" id="foreign" inputmode="decimal" value="1" aria-label="외화 금액">
              </div>
              <div class="calc__row">
                <span class="select" style="display:flex;align-items:center">🇰🇷 KRW</span>
                <input class="input-line" id="krw" inputmode="numeric" aria-label="원화 금액">
              </div>
            </div>
            <p class="updated" id="rate-date"></p>
          </section>

          <section class="section">
            <h2 class="section__title">환율 <small style="font-weight:400;color:var(--text-sub);font-size:12px">Frankfurter API</small></h2>
            <div class="ticker-list" id="rates"></div>
          </section>
        </div>

        <section class="section" id="coin">
          <h2 class="section__title">코인 시세 <small style="font-weight:400;color:var(--text-sub);font-size:12px">업비트 API · 10초마다 갱신</small></h2>
          <div class="ticker-list" id="coins"></div>
          <p class="updated" id="coin-time"></p>
        </section>
      </div>
    </main>
  </div>
</body>
</html>
